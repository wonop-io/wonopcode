[package]
name = "wonopcode-iggy-embedded"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Embedded Apache Iggy server for standalone Wonopcode operation"

[lints]
workspace = true

[dependencies]
# Workspace dependencies
wonopcode-transport = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["process", "sync", "time", "fs", "io-util"] }

# Error handling
thiserror = { workspace = true }

# Serialization for config
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
tracing = { workspace = true }
tempfile = { workspace = true }
dirs = { workspace = true }
which = "7"
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
