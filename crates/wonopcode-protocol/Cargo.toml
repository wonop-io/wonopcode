[package]
name = "wonopcode-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared protocol types for wonopcode client-server communication"

[features]
default = []
# Enable the new reliable WebSocket protocol (v2)
reliable = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time and IDs (for reliable protocol)
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v7", "serde"] }

# Error handling
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
pretty_assertions = "1.4"
